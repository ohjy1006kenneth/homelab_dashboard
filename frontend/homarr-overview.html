<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home</title>
<style>
:root{color-scheme:dark;--text:#f4f3e8;--muted:#c8c8b6;--line:rgba(231,238,205,.10);--panel:rgba(30,38,18,.42);--panel2:rgba(24,31,15,.55);--green:#16c86d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:transparent}body{padding:10px 12px 18px;font-size:12px}a{color:inherit;text-decoration:none}.grid{display:grid;grid-template-columns:1.42fr .86fr .92fr 1.26fr;grid-template-rows:auto auto 1fr;gap:12px;max-width:1400px;margin:auto}.glass{background:linear-gradient(135deg,rgba(33,44,18,.46),rgba(43,33,17,.37));border:1px solid rgba(232,239,207,.08);box-shadow:0 8px 24px rgba(0,0,0,.18);backdrop-filter:blur(9px);border-radius:4px}.weather{grid-column:1;grid-row:1;padding:12px 18px}.weather-now{display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:12px;font-size:18px}.weather-days{display:grid;grid-template-columns:repeat(5,1fr);text-align:center;gap:8px;color:#eeeede}.weather-days b{display:block;font-size:11px;margin-bottom:6px}.weather-days span{display:block;color:#dadbc9;margin-top:4px}.services{grid-column:1;grid-row:2;padding:8px 8px 10px}.service-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px}.service{text-align:center;position:relative;min-width:0}.service-label{font-size:10px;font-weight:700;margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.service img{display:block;width:58px;height:58px;object-fit:contain;margin:auto;border-radius:13px;filter:drop-shadow(0 4px 7px rgba(0,0,0,.25))}.dot{position:absolute;width:10px;height:10px;border-radius:50%;background:#7d826f;bottom:1px;right:calc(50% - 35px);box-shadow:0 0 8px rgba(0,0,0,.35)}.dot.up{background:var(--green)}.sessions{grid-column:1;grid-row:3;overflow:hidden;align-self:start}.sessions table{border-collapse:collapse;width:100%;font-size:10px}.sessions th,.sessions td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sessions th{font-size:13px;color:#dfdfcb}.sessions td:nth-child(2){color:#d7dac6}.focus{grid-column:2;grid-row:1 / span 2;min-height:238px;position:relative;overflow:hidden;background:linear-gradient(rgba(10,13,8,.18),rgba(10,13,8,.45)),url('/assets/focus.jpg') center/cover}.focus-controls{position:absolute;inset:16px;display:flex;flex-direction:column;align-items:center}.focus-pills{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}.pill{font:inherit;font-size:9px;border:0;border-radius:999px;padding:5px 9px;background:#f2efe2;color:#222;cursor:pointer}.clock{margin:auto 0 8px;font-size:46px;line-height:1;font-weight:700;text-shadow:0 2px 10px #000}.start{border:0;border-radius:999px;background:#f7f4eb;color:#171713;font-size:12px;font-weight:700;padding:7px 28px;cursor:pointer}.mini-actions{position:absolute;right:10px;bottom:8px;font-size:22px;letter-spacing:4px}.bookmarks{grid-column:3;grid-row:1 / span 2;padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;align-content:start}.bookmark-group h3{font-size:12px;margin:0 0 8px}.bookmark{display:block;margin:7px 0}.bookmark b{display:block;font-size:10px}.bookmark small{color:#d2d5c3;font-size:8px}.stats{grid-column:2 / span 2;grid-row:3;padding:10px 12px;align-self:start}.rings{display:flex;justify-content:center;gap:26px;margin:2px 0 12px}.ring{--p:50;--c:#88a54f;width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(225,232,201,.16) 0);position:relative}.ring:after{content:"";position:absolute;inset:7px;background:rgba(42,48,25,.92);border-radius:50%}.ring span{z-index:1;text-align:center;font-size:10px}.ring b{display:block;font-size:11px}.drive{display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin:10px 0}.drive-label{font-size:10px}.drive-meta{font-size:9px;color:#d9dbc8}.bar{grid-column:1 / -1;height:14px;background:rgba(219,224,200,.25);border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;background:#13bd5f;color:#07170e;font-style:normal;font-size:8px;padding-left:5px;line-height:14px}.news{grid-column:4;grid-row:1 / span 3;padding:8px;align-self:start;min-height:600px}.news-list{display:flex;flex-direction:column;gap:9px}.news-card{display:block;padding:12px 13px;background:rgba(43,49,26,.46);border:1px solid rgba(227,233,200,.08);border-radius:3px}.news-card:nth-child(2){background:rgba(92,78,28,.47)}.news-card:nth-child(3){background:rgba(110,49,32,.52)}.news-card h2{font-size:15px;line-height:1.25;font-weight:500;margin:0 0 9px}.news-card p{font-size:9px;line-height:1.45;color:#d0d0bd;margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.news-card footer{font-size:8px;color:#aeb49e}.empty{padding:35px 12px;text-align:center;color:var(--muted)}
@media(min-width:601px){body{height:100vh;overflow:hidden;background:#111 url('/assets/background.jpg') center/cover fixed no-repeat;padding:8px}body:before{content:"";position:fixed;inset:0;background:rgba(8,11,5,.5);backdrop-filter:blur(3px);z-index:0;pointer-events:none}.grid{position:relative;z-index:1;height:calc(100vh - 16px);grid-template-rows:minmax(0,23fr) minmax(0,34fr) minmax(0,43fr);gap:7px}.glass{min-height:0}.weather{padding:5px 10px;overflow:hidden}.weather-now{margin-bottom:4px;font-size:14px}.weather-days b{margin-bottom:2px}.services{padding:5px}.service-grid{gap:3px 5px;height:100%;align-items:center}.service-label{margin-bottom:3px;font-size:9px}.service img{width:clamp(28px,9vh,52px);height:clamp(28px,9vh,52px)}.sessions table{font-size:8px}.sessions th,.sessions td{padding:clamp(2px,.7vh,6px) 6px}.sessions th{font-size:10px}.focus{min-height:0}.clock{font-size:clamp(30px,7vh,52px)}.focus-pills{top:5px}.pill{font-size:7px;padding:3px 8px}.start{padding:5px 24px}.bookmarks{padding:7px 9px}.bookmark{margin:4px 0}.bookmark b,.bookmark small{font-size:8px}.stats{padding:7px}.rings{margin-bottom:4px}.ring{width:clamp(45px,10vh,68px);height:clamp(45px,10vh,68px)}.ring:before{width:calc(100% - 12px);height:calc(100% - 12px)}.ring span{font-size:7px}.ring b{font-size:10px}.drive{font-size:8px}.news{padding:6px;overflow:hidden}.news-list{gap:5px}.news-card{padding:8px 10px;min-height:0}.news-card h2{font-size:clamp(10px,1.5vh,15px);line-height:1.08;margin-bottom:4px}.news-card p{font-size:clamp(7px,1vh,9px);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.news-card footer{font-size:7px;margin-top:4px}}
@media(max-width:600px){body{background:#111 url('/assets/background.jpg') center/cover fixed no-repeat;padding:8px}.grid{display:block}.grid>*{margin-bottom:10px}.news-list{display:block}.news-card{margin-bottom:8px}.clock{font-size:40px}.focus{min-height:240px}.service img{width:52px;height:52px}}
</style>
</head>
<body>
<main class="grid">
<section class="weather glass"><div class="weather-now"><span id="weather-icon">☀</span><span id="temp">—°F</span></div><div class="weather-days" id="forecast"><span>Locating weather…</span></div></section>
<section class="services glass"><div class="service-grid" id="services"></div></section>
<section class="sessions glass"><table><thead><tr><th>Name</th><th>State</th><th>Endpoint</th></tr></thead><tbody id="service-rows"><tr><td colspan="3">Checking services…</td></tr></tbody></table></section>
<section class="focus glass"><div class="focus-controls"><div class="focus-pills"><button class="pill" data-min="25">Pomodoro</button><button class="pill" data-min="5">Short break</button><button class="pill" data-min="15">Long break</button></div><div class="clock" id="clock">25:00</div><button class="start" id="start">start</button><div class="mini-actions">◼ ⚙</div></div></section>
<section class="bookmarks glass"><div class="bookmark-group"><h3>Education</h3><a class="bookmark" href="https://www.edx.org" target="_blank"><b>edX</b><small>edx.org</small></a><a class="bookmark" href="https://www.khanacademy.org" target="_blank"><b>Khan Academy</b><small>khanacademy.org</small></a><a class="bookmark" href="https://www.coursera.org" target="_blank"><b>Coursera</b><small>coursera.org</small></a><a class="bookmark" href="https://www.youtube.com" target="_blank"><b>YouTube</b><small>youtube.com</small></a></div><div class="bookmark-group"><h3>Leisure</h3><a class="bookmark" href="https://www.reddit.com" target="_blank"><b>Reddit</b><small>reddit.com</small></a><a class="bookmark" href="https://twitter.com" target="_blank"><b>Twitter</b><small>twitter.com</small></a><a class="bookmark" href="https://www.tumblr.com" target="_blank"><b>Tumblr</b><small>tumblr.com</small></a><a class="bookmark" href="https://www.netflix.com" target="_blank"><b>Netflix</b><small>netflix.com</small></a></div></section>
<section class="stats glass"><div class="rings" id="rings"></div><div id="drives"></div></section>
<aside class="news glass"><div class="news-list" id="news"><div class="empty">Loading news brief…</div></div></aside>
</main>
<script>
const APPS=[['Portainer','http://10.1.188.19:9000','https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/portainer.png','portainer'],['Immich','http://10.1.188.19:2283','https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/immich.png','immich'],['Syncthing','http://10.1.188.19:8384','https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/syncthing.png','syncthing'],['Pi-hole','http://10.1.188.19:8080/admin','https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/pi-hole.png','pihole'],['Jellyfin','http://10.1.188.19:8096','https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/jellyfin.png','jellyfin'],['AI Streams','http://10.1.188.19:3000','https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/stremio.png','aiostreams']];
let statuses={};function renderApps(){services.innerHTML=APPS.map(a=>`<a class="service" href="${a[1]}" target="_blank"><div class="service-label">${a[0]}</div><img src="${a[2]}" alt=""><i class="dot ${statuses[a[3]]?'up':''}"></i></a>`).join('')}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadData(){try{const r=await fetch('/api/overview');const d=await r.json();statuses=d.services||{};renderApps();document.getElementById('service-rows').innerHTML=(d.service_rows||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.up?'● Online':'○ Offline'}</td><td>${esc(x.endpoint)}</td></tr>`).join('');rings.innerHTML=(d.metrics||[]).map((m,i)=>`<div class="ring" style="--p:${m.percent};--c:${['#8ca84f','#93ad51','#ef7b26'][i]}"><span><b>${esc(m.value)}</b>${esc(m.label)}</span></div>`).join('');drives.innerHTML=(d.drives||[]).map(x=>`<div class="drive"><span class="drive-label">▱ ${esc(x.name)}</span><span class="drive-meta">${esc(x.free)} free</span><div class="bar"><i style="width:${x.percent}%">${x.percent}%</i></div></div>`).join('')}catch(e){renderApps()}}
async function loadNews(){try{const r=await fetch('/api/news');const d=await r.json();news.innerHTML=d.items.length?d.items.slice(0,5).map(x=>`<a class="news-card" href="${esc(x.url)}" target="_blank"><h2>${esc(x.title)}</h2><p>${esc(x.summary)}</p><footer>◉ ${esc(x.source)} · ${esc(x.published)}</footer></a>`).join(''):'<div class="empty">No news brief available.</div>'}catch(e){news.innerHTML='<div class="empty">News is temporarily unavailable.</div>'}}
const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];async function loadWeather(){try{const geo=await fetch('https://ipapi.co/json/').then(r=>r.json());const lat=geo.latitude,lon=geo.longitude;const w=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=auto&forecast_days=5`).then(r=>r.json());document.getElementById('temp').textContent=`${Math.round(w.current.temperature_2m)}°F`;document.getElementById('weather-icon').textContent=w.current.weather_code<3?'☀':'☁';document.getElementById('forecast').innerHTML=w.daily.time.map((x,i)=>`<span><b>${days[new Date(x+'T12:00').getDay()]}</b>${w.daily.weather_code[i]<3?'☀':'☁'}<span>${Math.round(w.daily.temperature_2m_max[i])}°F</span></span>`).join('')}catch(e){document.getElementById('forecast').innerHTML='<span>Weather unavailable</span>'}}
let left=1500,timer=null;function draw(){clock.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`}document.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{clearInterval(timer);timer=null;left=+b.dataset.min*60;start.textContent='start';draw()});start.onclick=()=>{if(timer){clearInterval(timer);timer=null;start.textContent='start'}else{start.textContent='pause';timer=setInterval(()=>{if(left>0){left--;draw()}else{clearInterval(timer);timer=null;start.textContent='start'}},1000)}};
renderApps();loadData();loadNews();loadWeather();setInterval(loadData,60000);setInterval(loadNews,300000);
</script>
</body>
</html>
